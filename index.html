<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハンガンラーメン HANORI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #5FC0E0;
    --yellow: #FCF050;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    font-family: "M PLUS Rounded 1c", sans-serif;
  }

  /* スクロール量そのものが動画とオーバーレイの進行度になる、長い土台(高さはJSで設定) */
  .scroll-stage {
    position: relative;
  }

  /* 固定ヘッダー(背景バーなし、透明。冒頭のロゴが移動して収まる土台のみ) */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 64px;
    background: transparent;
    z-index: 50;
    opacity: 0;
  }
  .site-header-inner {
    height: 100%;
    width: 100%;
    padding: 38px 20px 0;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }
  /* ナビ全体を包む「ピル」型の土台。この中を赤枠がカーソル追従でスライドする(全体1.2倍) */
  .header-nav {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 17px;
  }
  .nav-icon-box {
    position: relative;
    z-index: 2;
    width: 53px;
    height: 53px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .header-nav img {
    height: 31px;
    width: 31px;
    display: block;
  }
  /* カーソルを合わせたアイコンの位置へJSでスライドする赤枠 */
  .nav-highlight {
    position: absolute;
    top: 7px;
    left: 7px;
    width: 53px;
    height: 53px;
    border: 2px solid #C0392B;
    border-radius: 9px;
    z-index: 1;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.2s ease;
    pointer-events: none;
  }

  /* 冒頭は画面中央に大きく、スクロールでヘッダー左端の定位置へ移動するロゴ(ドックサイズ3倍) */
  .brand-mark {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 60;
    /* JSが動く前(動画メタデータ待ちの間など)でも中央に見えるようにしておく保険。
       JS側もintroT=0で同じ値(xPercent/yPercent:-50)を設定するので競合しない。 */
    transform: translate(-50%, -50%);
    will-change: transform, top, left;
  }
  .brand-mark img {
    display: block;
    width: clamp(90px, 22vw, 216px);
  }

  /* 冒頭のみ表示する「スクロールダウン」の案内(スクロール開始とともにフェードアウト) */
  /* ネオンサイン風デザイン(参考画像のCAFE/WELCOMEネオン看板を踏襲) */
  .scroll-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    pointer-events: none;
  }
  .scroll-hint-text {
    position: relative;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.2em;
    color: #ffffff;
    text-shadow:
      0 0 4px #ffffff,
      0 0 10px #ff3ea5,
      0 0 22px #ff3ea5,
      0 0 44px #ff3ea5;
    padding: 0 26px;
  }
  /* 参考画像の放射状のネオン光の線を簡略化して再現 */
  .scroll-hint-text::before,
  .scroll-hint-text::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 16px;
    height: 2px;
    background: #ff3ea5;
    box-shadow: 0 0 6px #ff3ea5, 0 0 14px #ff3ea5;
  }
  .scroll-hint-text::before {
    left: 0;
    transform: translateY(-50%) rotate(-25deg);
  }
  .scroll-hint-text::after {
    right: 0;
    transform: translateY(-50%) rotate(25deg);
  }
  .scroll-hint-bar {
    width: 3px;
    height: 40px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(93, 216, 255, 0.6);
  }
  .scroll-hint-bar::after {
    content: '';
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: #5dd8ff;
    box-shadow: 0 0 8px #5dd8ff, 0 0 16px #5dd8ff;
    border-radius: 2px;
    animation: scrollHintMove 1.4s ease-in-out infinite;
  }
  @keyframes scrollHintMove {
    0% { top: -100%; }
    100% { top: 100%; }
  }

  /*
    進行状況インジケーター(2026-09-13): 動画区間のどのビートを見ているかをドットで示す。
    クリックでそのビートへスムーススクロールできる、ヘッダーナビと同じジャンプ機能も兼ねる。
  */
  .progress-dots {
    position: fixed;
    right: 22px;
    top: 50%;
    left: auto;
    transform: translateY(-50%);
    z-index: 55;
    display: flex;
    flex-direction: column;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .progress-dots.is-visible {
    pointer-events: auto;
  }
  .progress-dot {
    width: 10px;
    height: 10px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.75);
    background: transparent;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .progress-dot.is-active {
    background: #ffffff;
    transform: scale(1.3);
  }

  .pin-wrap {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
  }

  #hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .ov-item {
    position: absolute;
    top: 50%;
    left: 50%;
    text-align: center;
    opacity: 0;
    will-change: transform, opacity;
  }

  /*
    「カレンダー・イベント・お知らせ」パネル(2026-09-13)
    3つの枠を2行グリッドで配置(上段: カレンダー+イベント、下段: お知らせを横いっぱいに)。
    後ろの動画が透けて見えるよう、各枠の背景はどれも半透明(アルファ0.4=透過率60%目安)。
  */
  .info-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    width: min(74vw, 940px);
    margin: 0 auto;
    text-align: left;
    transform: scale(1.3);
  }
  .panel {
    border-radius: 16px;
    padding: 18px 22px;
    box-shadow: 0 16px 32px rgba(10, 20, 40, 0.22);
    opacity: 0;
    will-change: transform, opacity;
  }
  .panel-label {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: clamp(14px, 1.8vw, 20px);
    letter-spacing: 0.08em;
  }
  /* カレンダー: 赤系、半透明 */
  .panel-calendar {
    position: relative;
    grid-column: 1;
    background: rgba(214, 58, 58, 0.4);
    color: #ffffff;
  }
  .panel-cal-title {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: clamp(18px, 2.4vw, 26px);
    margin-bottom: 10px;
  }
  /* カレンダー凡例(右上): 青丸+「休業日」。木曜(定休日)のマス目に付ける青丸と対応 */
  .cal-legend {
    position: absolute;
    top: 18px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 1.43vw, 15.6px);
    color: #ffffff;
  }
  .cal-legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #2596be;
    flex-shrink: 0;
  }
  .closed-day {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.8em;
    height: 1.8em;
    border-radius: 50%;
    background: #2596be;
    color: #ffffff;
  }
  .mini-calendar {
    width: 100%;
    border-collapse: collapse;
    font-family: "M PLUS Rounded 1c", sans-serif;
  }
  .mini-calendar th,
  .mini-calendar td {
    text-align: center;
    padding: 3px 2px;
    font-size: clamp(10px, 1.1vw, 13px);
    font-weight: 700;
  }
  .mini-calendar th {
    opacity: 0.85;
    font-weight: 800;
  }
  .mini-calendar th.sun { color: #ffd9d9; }
  .mini-calendar th.sat { color: #cfe9ff; }
  /* イベント: オフホワイト系、半透明 */
  .panel-event {
    grid-column: 2;
    background: rgba(250, 247, 238, 0.4);
    color: #1a1a1a;
  }
  .panel-event-frame {
    margin-top: 14px;
    min-height: 108px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2px solid rgba(37, 150, 190, 0.3);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.35);
  }
  .event-date {
    flex-shrink: 0;
    text-align: center;
    line-height: 1.15;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: clamp(16px, 2vw, 22px);
    color: #2596be;
  }
  .event-date span {
    display: block;
    font-size: clamp(9px, 1vw, 11px);
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #1a1a1a;
    opacity: 0.6;
  }
  .event-title {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 1.6vw, 17px);
    color: #1a1a1a;
    line-height: 1.4;
  }
  /* お知らせ: 黄色系、半透明、横いっぱい */
  .panel-notice {
    grid-column: 1 / span 2;
    min-height: 135px;
    background: rgba(252, 224, 80, 0.4);
    color: #1a1a1a;
  }

  /*
    iPhone専用(2026-09-13): カレンダー・イベントの2列並びだと幅が狭すぎて
    イベントの文字が縦書き状態になってしまうため、狭い画面では3枚とも
    縦に1列積みにする。あわせて拡大率(transform:scale)も下げ、ヘッダーの
    ナビと重ならないようにする。
  */
  @media (max-width: 600px) {
    .info-panels {
      grid-template-columns: 1fr;
      width: 86vw;
      transform: scale(1);
    }
    .panel-calendar,
    .panel-event,
    .panel-notice {
      grid-column: 1;
    }
  }

  /*
    幕4(締め): 中央の大ロゴは専用画像ではなく、ヘッダーに収まった本物の#brand-mark
    自体をイントロと逆方向に動かして再現する(updateOutro参照)。そのためこの
    テキストブロックは画面中央ではなく下寄りに配置し、大きくなったロゴと重ならない
    ようにする。
  */
  .ov-final {
    top: auto;
    bottom: 10%;
  }
  .ov-final-sub {
    margin-top: 0;
    font-size: clamp(16px, 2.6vw, 26px);
    font-weight: 800;
    color: #ffffff;
    -webkit-text-stroke: 1px #1a1a1a;
    paint-order: stroke fill;
  }
  .ov-final-info {
    margin-top: 14px;
    font-size: clamp(12px, 1.6vw, 15px);
    font-weight: 700;
    color: #ffffff;
  }
  .ov-final-info a {
    color: #ffffff;
    text-decoration: underline;
  }

  /*
    セクション1「漢江ラーメンとは」(2026-09-13、動画冒頭に重ねる形に作り直し)
    独立した別セクションではなく、動画スクラブの冒頭(麺が入ってくる区間)に重ねて表示する
    オーバーレイ。左の写真は下方向、右の写真は上方向へ流れ、中央にテキストが入る。
  */
  .intro-photo {
    position: absolute;
    aspect-ratio: 4 / 3;
    opacity: 0;
    will-change: transform, opacity;
  }
  .intro-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    border: 3px solid #C0392B;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    display: block;
  }
  /*
    iPhone専用(2026-09-13): この写真はJS側でscale(2)がかかっているため、
    枠線もそのまま2倍の太さで見えてしまう。見た目の太さを半分にするため、
    元の値を1.5px(2倍されて3px相当)にしておく。
  */
  @media (max-width: 600px) {
    .intro-photo img {
      border-width: 1.5px;
    }
  }
  .placeholder-box {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(255, 255, 255, 0.55);
    border: 2px dashed rgba(26, 26, 26, 0.35);
    border-radius: 10px;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #1a1a1a;
    padding: 8px;
  }
  .intro-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 500;
    font-size: clamp(20px, 3vw, 32px);
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 2px 14px rgba(20, 90, 130, 0.55), 0 1px 3px rgba(20, 90, 130, 0.35);
    white-space: nowrap;
    z-index: 5;
  }

  /*
    セクション2「24種類のラーメンがある」(2026-09-13、動画内オーバーレイに変更)
    独立したセクションではなく、動画スクラブ中の「店内写真(幕1)の後・お湯が注がれる(幕3)の前」
    の区間(videoProgress 0.33〜0.59、幕2に相当)に重ねるオーバーレイとして実装。
    商品パッケージ(袋麺)が画面左右に散らばった状態から、それぞれ異なるタイミングで
    下から浮かび上がり、区間の終わり際にまとめてさらに上へ抜けていく。
  */
  .menu-heading {
    position: absolute;
    top: 50%;
    left: 50%;
    text-align: center;
    z-index: 5;
    opacity: 0;
    will-change: transform, opacity;
  }
  .menu-title {
    display: block;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 60px);
    line-height: 1.35;
    color: #1a1a1a;
    white-space: nowrap;
  }
  .menu-title em {
    font-style: normal;
    color: #ff6a3d;
  }
  .menu-subtitle {
    display: block;
    margin-top: 10px;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 1.8vw, 20px);
    letter-spacing: 0.04em;
    color: #2596be;
    white-space: nowrap;
  }
  /* 見出しの文字が波打つように、1文字ずつずらしてゆっくり上下する(JSで1文字ごとにspan化) */
  .menu-title .wave-char,
  .menu-subtitle .wave-char {
    display: inline-block;
    animation: menuTitleWave 1.8s ease-in-out infinite;
  }
  @keyframes menuTitleWave {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .menu-packet {
    position: absolute;
    opacity: 0;
    will-change: transform, opacity;
    filter: drop-shadow(0 18px 22px rgba(20, 40, 60, 0.22));
  }
  .menu-packet img {
    width: 100%;
    display: block;
  }
</style>
</head>
<body>

<header class="site-header" id="site-header">
  <div class="site-header-inner">
    <nav class="header-nav" id="header-nav">
      <div class="nav-highlight" id="nav-highlight"></div>
      <div class="nav-icon-box" data-jump="0.16" title="店内・料理を見る"><img src="assets/images/icons/icon-4-chair.png" alt="店内・料理を見る"></div>
      <div class="nav-icon-box" data-jump="0.46" title="24種のラーメンを見る"><img src="assets/images/icons/icon-2-machine.png" alt="24種のラーメンを見る"></div>
      <div class="nav-icon-box" data-jump="0.76" title="カレンダー・イベント・お知らせを見る"><img src="assets/images/icons/icon-3-calendar.png" alt="カレンダー・イベント・お知らせを見る"></div>
      <a class="nav-icon-box" href="https://www.instagram.com/hanori_okinawa/" target="_blank" rel="noopener" title="Instagramを見る"><img src="assets/images/icons/icon-1-instagram.png" alt="Instagram"></a>
    </nav>
  </div>
</header>

<div class="brand-mark" id="brand-mark">
  <img src="assets/images/hanori-logo.png" alt="ハンガンラーメン HANORI">
</div>

<div class="scroll-hint" id="scroll-hint">
  <span class="scroll-hint-text">SCROLL DOWN</span>
  <div class="scroll-hint-bar"></div>
</div>

<div class="progress-dots" id="progress-dots">
  <button class="progress-dot" data-jump="0.16" aria-label="漢江ラーメンとは"></button>
  <button class="progress-dot" data-jump="0.46" aria-label="24種のラーメン"></button>
  <button class="progress-dot" data-jump="0.76" aria-label="カレンダー・イベント・お知らせ"></button>
  <button class="progress-dot" data-jump="0.92" aria-label="SPOT"></button>
</div>

<div class="scroll-stage" id="stage">
  <div class="pin-wrap">
    <video id="hero-video" muted playsinline preload="auto">
      <source src="assets/video/hero-scrub.mp4" type="video/mp4">
      <source src="assets/video/hero-scrub.webm" type="video/webm">
    </video>

    <div class="overlay">
      <!-- 「漢江ラーメンとは」: 動画冒頭(麺が入ってくる区間)に重ねる写真+テキスト -->
      <div class="intro-photo intro-left" id="intro-photo-1" style="top:10%; left:3%; width:15vw;">
        <img src="assets/images/about/interior-1.jpg" alt="店内(セルフ調理機コーナー)">
      </div>
      <div class="intro-photo intro-left" id="intro-photo-2" style="top:38%; left:11%; width:11vw;">
        <img src="assets/images/about/food-1.jpg" alt="出来上がったラーメンを食べるところ">
      </div>
      <div class="intro-photo intro-left" id="intro-photo-3" style="top:64%; left:5%; width:13vw;">
        <img src="assets/images/about/food-2.jpg" alt="テーブルに並んだラーメンとドリンク">
      </div>

      <div class="intro-photo intro-right" id="intro-photo-4" style="top:12%; right:3%; width:14vw;">
        <img src="assets/images/about/interior-2.jpg" alt="店内(カウンター・調理機全景)">
      </div>
      <div class="intro-photo intro-right" id="intro-photo-5" style="top:40%; right:12%; width:12vw;">
        <img src="assets/images/about/food-center.jpg" alt="完成したハンガンラーメンの一杯">
      </div>
      <div class="intro-photo intro-right" id="intro-photo-6" style="top:66%; right:5%; width:13vw;">
        <img src="assets/images/about/exterior-1.jpg" alt="店外・外観">
      </div>

      <div class="intro-text" id="intro-text">沖縄で気軽に韓国気分</div>

      <!-- 「24種類のラーメンがある」: 店内写真(幕1)の後、お湯が注がれる(幕3)の前に重ねるオーバーレイ -->
      <div class="menu-heading" id="menu-heading">
        <span class="menu-title">24種の<em>韓国ラーメン</em></span>
        <span class="menu-subtitle">あなたのお気に入りの味がきっと見つかる</span>
      </div>

      <div class="menu-packet" id="packet-1" style="top:22%; left:1%; width:10vw;">
        <img src="assets/images/packets/packet-soul-spicy.png" alt="辛旨 SOUL SPICY RAMEN">
      </div>
      <div class="menu-packet" id="packet-2" style="top:65%; left:8%; width:12vw;">
        <img src="assets/images/packets/packet-yuzu-shio.png" alt="유자소금 YUZU SHIO RAMEN">
      </div>
      <div class="menu-packet" id="packet-3" style="top:18%; right:5%; width:13vw;">
        <img src="assets/images/packets/packet-mala-hotpot.png" alt="마라 훠궈 라면 MALA HOTPOT RAMEN">
      </div>
      <div class="menu-packet" id="packet-4" style="top:56%; right:6%; width:12vw;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/*
  iPhone専用の拡大指定に使う判定(2026-09-13)。画面幅ベースの簡易判定で、
  PC側の見た目には一切影響しない(この定数を使っている箇所だけがiPhone等の
  狭い画面でのみ変わる)。
*/
const IS_MOBILE = window.matchMedia('(max-width: 600px)').matches;

const video = document.getElementById('hero-video');
const stage = document.getElementById('stage');
const siteHeader = document.getElementById('site-header');
const brandMark = document.getElementById('brand-mark');

/*
  ナビの赤枠ハイライト: カーソルを合わせたアイコンの位置へスライドする。
  ハイライトは1つの共有要素をtransformで動かす方式(参考画像のタブナビと同じ構造)。
*/
const headerNav = document.getElementById('header-nav');
const navHighlight = document.getElementById('nav-highlight');
const navIconBoxes = headerNav.querySelectorAll('.nav-icon-box');

navIconBoxes.forEach((box) => {
  box.addEventListener('mouseenter', () => {
    const offsetX = box.offsetLeft - navIconBoxes[0].offsetLeft;
    navHighlight.style.transform = `translateX(${offsetX}px)`;
    navHighlight.style.opacity = '1';
  });
});
headerNav.addEventListener('mouseleave', () => {
  navHighlight.style.opacity = '0';
});

/*
  スクロール量の配分(vh単位)。
  - INTRO_VH: 冒頭の「文字がヘッダーへ収まる」演出専用の区間(この間、動画は0コマ目で停止)
  - VIDEO_VH: 動画スクラブに使う区間(「動画の再生が早すぎる」との指摘を受けて大幅に延長)
  数値を変えるだけで全体のペースを調整できるよう、ここに集約する。
*/
const INTRO_VH = 150;
const VIDEO_VH = 1800;
const TOTAL_VH = INTRO_VH + VIDEO_VH;
stage.style.height = `${TOTAL_VH}vh`;

const INTRO_END = INTRO_VH / TOTAL_VH;

/*
  ヘッダーナビのアイコンをセクションジャンプとして使う。videoProgress(動画の進行度
  0〜1)を、スクロール位置(px)に逆算してsmooth scrollする。scrubがスクロール量に
  1:1で連動しているため、スムーススクロール自体が「早送りで見せる」演出にもなる。
*/
function scrollToVideoProgress(vp) {
  const rawProgress = INTRO_END + vp * (1 - INTRO_END);
  // stageTrigger(ScrollTriggerインスタンス)自身が把握している実際のスクロール範囲
  // (.start〜.end)を使う。iOS Safariはアドレスバーの開閉でvh(=window.innerHeight)の
  // 基準がその場その場でズレることがあり、「stage.offsetHeight - window.innerHeight」を
  // クリックのたびに自前で計算し直すと、実際にスクロールが連動している範囲とズレて
  // 別の場所へジャンプしてしまう。ScrollTrigger自身の.start/.endを使えば、今まさに
  // 画面を動かしているのと同じ基準でジャンプ先を計算できる。
  const targetY = stageTrigger
    ? stageTrigger.start + rawProgress * (stageTrigger.end - stageTrigger.start)
    : rawProgress * (stage.offsetHeight - window.innerHeight);
  smoothScrollTo(targetY);
}

/*
  ネイティブのwindow.scrollTo({behavior:'smooth'})は、このサイトのように
  scrollイベントのたびに重い処理(video.currentTimeの書き換えやGSAPのset呼び出し)を
  行っているページだと、アニメーションの途中で止まってしまい、狙った位置に届かない
  ことがある(GSAP公式もScrollTriggerとネイティブのsmooth scrollの併用は非推奨としている)。
  代わりに、自前のrequestAnimationFrameループで少しずつwindow.scrollTo(瞬間移動)を
  呼び続ける簡易スムーススクロールに置き換える。
*/
function smoothScrollTo(targetY, duration = 700) {
  const startY = window.scrollY;
  const distance = targetY - startY;
  if (Math.abs(distance) < 1) return;
  const startTime = performance.now();
  let done = false;
  function step(now) {
    if (done) return;
    const t = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    window.scrollTo(0, startY + distance * eased);
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      done = true;
    }
  }
  requestAnimationFrame(step);
  // タブのバックグラウンド化や端末側の間引きでrAFループが完走しなかった場合の保険。
  // 想定時間を過ぎても終わっていなければ、最終位置へ瞬間移動して必ず着地させる。
  setTimeout(() => {
    if (!done) {
      done = true;
      window.scrollTo(0, targetY);
    }
  }, duration + 400);
}

document.querySelectorAll('.nav-icon-box[data-jump]').forEach((box) => {
  box.addEventListener('click', () => {
    scrollToVideoProgress(parseFloat(box.dataset.jump));
  });
});

/*
  進行状況ドット: 今どのビートを見ているかを示し、クリックでそこへジャンプできる。
  ヘッダーナビと同じscrollToVideoProgress()を使い回す。
*/
const progressDotsEl = document.getElementById('progress-dots');
const progressDots = Array.from(progressDotsEl.querySelectorAll('.progress-dot'));
const PROGRESS_DOT_RANGES = [
  { min: 0.00, max: 0.32 },
  { min: 0.33, max: 0.59 },
  { min: 0.60, max: 0.85 },
  { min: 0.85, max: 1.00 },
];

progressDots.forEach((dot) => {
  dot.addEventListener('click', () => {
    scrollToVideoProgress(parseFloat(dot.dataset.jump));
  });
});

function updateProgressDots(videoProgress) {
  gsap.set(progressDotsEl, { opacity: videoProgress > 0 ? 1 : 0 });
  progressDotsEl.classList.toggle('is-visible', videoProgress > 0);

  let activeIndex = -1;
  PROGRESS_DOT_RANGES.forEach((range, i) => {
    if (videoProgress >= range.min && videoProgress <= range.max) activeIndex = i;
  });
  progressDots.forEach((dot, i) => dot.classList.toggle('is-active', i === activeIndex));
}

/*
  4幕それぞれの「入り(0-35%)→留まる(35-65%)→抜け(65-100%)」定義。
  ここでのstart/endは「動画の進行度(0〜1)」に対する割合(INTRO_END以降の区間)。
  幕4だけexit:falseにして、着地したまま抜けさせない(scroll-storyboard.md参照)。
  横移動量は画面幅の35%(vw)を基準に、右から入り、左へ抜ける。
*/
const BEAT4_START = 0.85;
const BEAT4_END = 1.00;

const beats = [
  { el: document.getElementById('beat-4'), start: BEAT4_START, end: BEAT4_END, exit: false },
];

const TRAVEL_VW = 35;
const ENTER_FRAC = 0.35;
const EXIT_FRAC = 0.35;

// 幕4は画面下寄り(CSSの bottom:10%)に配置するため、yPercentでの中央揃えは不要
beats.forEach(b => gsap.set(b.el, { xPercent: -50 }));

/*
  beat-3(カレンダー・イベント・お知らせ)は、他の幕と違って中身の3枚が個別に
  スライドインする(赤→白→黄の順)ため、コンテナ自体は動かさず常時表示の土台に
  留め、中の3枚それぞれをupdatePanelsBeat()でずらしてアニメーションさせる。
*/
gsap.set(document.getElementById('beat-3'), { xPercent: -50, yPercent: -50, opacity: 1 });

/*
  「漢江ラーメンとは」: 動画冒頭(麺が入ってくる区間)に重ねる写真+中央テキスト。
  独立セクションではなく、動画のvideoProgress(0〜1)に連動するオーバーレイとして実装する。
  左の写真は上→下(さらに下へ抜ける)、右の写真は下→上(さらに上へ抜ける)に流れ、
  中央のテキストはフェードイン/フェードアウトのみ。
*/
const INTRO_PHOTOS_START = 0.0;
const INTRO_PHOTOS_END = 0.32; // 幕1「麺が入る」の区間に合わせる
const PHOTO_DRIFT_PX = 140;

const introLeftPhotos = gsap.utils.toArray('.intro-left');
const introRightPhotos = gsap.utils.toArray('.intro-right');
const introText = document.getElementById('intro-text');

// 店内・料理写真: iPhoneでは小さく見えるとの指摘があったため、2倍に拡大(PC側は1倍のまま)
if (IS_MOBILE) {
  [...introLeftPhotos, ...introRightPhotos].forEach(el => gsap.set(el, { scale: 2 }));
}

function updateIntroPhotos(videoProgress) {
  const span = INTRO_PHOTOS_END - INTRO_PHOTOS_START;
  let t;
  if (videoProgress <= INTRO_PHOTOS_START) {
    t = 0;
  } else if (videoProgress >= INTRO_PHOTOS_END) {
    t = 1;
  } else {
    t = (videoProgress - INTRO_PHOTOS_START) / span;
  }

  let y, opacity;
  if (t < ENTER_FRAC) {
    const p = t / ENTER_FRAC;
    y = 1 - p;
    opacity = p;
  } else if (t < (1 - EXIT_FRAC)) {
    y = 0;
    opacity = 1;
  } else {
    const p = (t - (1 - EXIT_FRAC)) / EXIT_FRAC;
    y = -p;
    opacity = 1 - p;
  }
  // videoProgressが範囲外(開始前・終了後)なら完全に隠す
  if (videoProgress < INTRO_PHOTOS_START || videoProgress > INTRO_PHOTOS_END) {
    opacity = 0;
  }

  introLeftPhotos.forEach(el => gsap.set(el, { y: `${-y * PHOTO_DRIFT_PX}px`, opacity }));
  introRightPhotos.forEach(el => gsap.set(el, { y: `${y * PHOTO_DRIFT_PX}px`, opacity }));
  gsap.set(introText, { opacity, xPercent: -50, yPercent: -50 });
}

/*
  冒頭の「ハンガンラーメン」文字 → ヘッダー内定位置への移動。
  中央×大きい状態(introT=0)から、ヘッダー内の左寄せ×等倍(introT=1)へ、
  スクロール量にリニアに連動して遷移する(scrub、時間オートアニメーションではない)。
*/
const HEADER_DOCK_TOP = 72;   // 2cm上げた後、1cm(≈38px)下げて調整
const HEADER_DOCK_LEFT = 8;   // 左端の角に詰める
const START_SCALE = 3.67;     // 最初のページのロゴを3倍に(216px×3.67≒792px、旧264pxの3倍)
const END_SCALE = 1;          // ドック後は216px(旧144pxの1.5倍)

const scrollHint = document.getElementById('scroll-hint');

function lerp(a, b, t) { return a + (b - a) * t; }

function updateIntro(rawProgress) {
  const introT = Math.min(rawProgress / INTRO_END, 1);
  const top = lerp(window.innerHeight * 0.5, HEADER_DOCK_TOP, introT);
  const left = lerp(window.innerWidth * 0.5, HEADER_DOCK_LEFT, introT);
  const xPercent = lerp(-50, 0, introT);
  const scale = lerp(START_SCALE, END_SCALE, introT);

  gsap.set(brandMark, { top, left, xPercent, yPercent: -50, scale });
  gsap.set(siteHeader, { opacity: introT });

  // 「スクロールダウン」案内はスクロール開始直後(イントロ前半)で素早くフェードアウト
  const hintOpacity = Math.max(1 - introT * 3, 0);
  gsap.set(scrollHint, { opacity: hintOpacity });
}

/*
  幕4(締め、videoProgress 0.85〜1.00): updateIntroの「大きい中央ロゴ→ヘッダーに
  収まる小さいロゴ」を逆再生する。ヘッダーに収まったままの本物の#brand-markを
  もう一度中央へ大きく戻すことで、「最初と同じ動き・同じサイズ」を逆向きに見せる。
  幕4に入るまで(outroT<=0)は何もせず、updateIntroが設定したドック状態のまま
  にしておく(このonUpdate内でupdateIntroの後に呼ぶことで、幕4区間だけ上書きする)。
*/
function updateOutro(videoProgress) {
  const outroT = Math.max(0, Math.min((videoProgress - BEAT4_START) / (BEAT4_END - BEAT4_START), 1));
  if (outroT <= 0) return;

  const top = lerp(HEADER_DOCK_TOP, window.innerHeight * 0.5, outroT);
  const left = lerp(HEADER_DOCK_LEFT, window.innerWidth * 0.5, outroT);
  const xPercent = lerp(0, -50, outroT);
  const scale = lerp(END_SCALE, START_SCALE, outroT);

  gsap.set(brandMark, { top, left, xPercent, yPercent: -50, scale });
  gsap.set(siteHeader, { opacity: 1 - outroT });
}

function updateBeat(beat, progress) {
  const { el, start, end, exit } = beat;
  const span = end - start;
  let x, opacity;

  if (progress <= start) {
    x = TRAVEL_VW;
    opacity = 0;
  } else if (progress >= end) {
    if (exit) {
      x = -TRAVEL_VW;
      opacity = 0;
    } else {
      x = 0;
      opacity = 1;
    }
  } else {
    const t = (progress - start) / span;
    if (t < ENTER_FRAC) {
      const p = t / ENTER_FRAC;
      x = TRAVEL_VW * (1 - p);
      opacity = p;
    } else if (!exit || t < (1 - EXIT_FRAC)) {
      x = 0;
      opacity = 1;
    } else {
      const p = (t - (1 - EXIT_FRAC)) / EXIT_FRAC;
      x = -TRAVEL_VW * p;
      opacity = 1 - p;
    }
  }

  gsap.set(el, { x: `${x}vw`, opacity });
}

/*
  「カレンダー・イベント・お知らせ」パネル: 3枚がまとめて動くのではなく、
  赤(カレンダー)→白(イベント)→黄(お知らせ)の順に、右からスライドインする。
  幕の窓(videoProgress 0.60〜0.85)自体はbeat-4までと共通だが、中身3枚それぞれに
  delayを持たせたミニ版のenter/hold/exit(updateBeatと同じ考え方)を適用する。
  退場(exit)は3枚まとめて同時に行う(ここは特に順番の指定がないため)。
*/
const PANELS_START = 0.60;
const PANELS_END = 0.85;
const PANELS_EXIT_START = 0.80; // 幕内(0〜1)でこの時点から3枚まとめて抜ける
const PANEL_ENTER_DURATION = 0.30;

const panelConfigs = [
  { el: document.getElementById('panel-calendar'), delay: 0.00 },
  { el: document.getElementById('panel-event'), delay: 0.12 },
  { el: document.getElementById('panel-notice'), delay: 0.24 },
];

function updatePanelsBeat(videoProgress) {
  const span = PANELS_END - PANELS_START;
  let t;
  if (videoProgress <= PANELS_START) {
    t = 0;
  } else if (videoProgress >= PANELS_END) {
    t = 1;
  } else {
    t = (videoProgress - PANELS_START) / span;
  }

  const exitT = Math.max(0, Math.min((t - PANELS_EXIT_START) / (1 - PANELS_EXIT_START), 1));

  panelConfigs.forEach(p => {
    const enterT = Math.max(0, Math.min((t - p.delay) / PANEL_ENTER_DURATION, 1));
    const x = TRAVEL_VW * (1 - enterT) - exitT * TRAVEL_VW;
    const opacity = enterT * (1 - exitT);
    gsap.set(p.el, { x: `${x}vw`, opacity });
  });

  if (videoProgress < PANELS_START || videoProgress > PANELS_END) {
    panelConfigs.forEach(p => gsap.set(p.el, { opacity: 0 }));
  }
}

let stageTrigger;

function runScrub(progress) {
  updateIntro(progress);

  // INTRO_END以降だけを動画の0〜1に再マッピング(イントロ中は0コマ目で静止)
  const videoProgress = progress <= INTRO_END
    ? 0
    : (progress - INTRO_END) / (1 - INTRO_END);

  if (video.duration) {
    video.currentTime = videoProgress * video.duration;
  }
  beats.forEach(beat => updateBeat(beat, videoProgress));
  updateIntroPhotos(videoProgress);
  updateMenuOverlay(videoProgress);
  updatePanelsBeat(videoProgress);
  updateOutro(videoProgress);
  updateProgressDots(videoProgress);
}

function setupScrub() {
  stageTrigger = ScrollTrigger.create({
    trigger: '#stage',
    start: 'top top',
    end: 'bottom bottom',
    scrub: true,
    onUpdate(self) {
      runScrub(self.progress);
    }
  });
}

/*
  ロゴの中央配置(updateIntro)は動画のメタデータに依存しないため、動画の読み込みを
  待たずに即座に一度実行しておく。モバイル回線などで動画の読み込みに時間がかかると、
  その間ずっと「JSがまだ何も設定していない、素のCSSのままの小さいロゴ」が中央からズレて
  見えてしまう(top:50%/left:50%だけでは中央揃えの補正が入らないため)問題への対策。
*/
updateIntro(0);
if (video.readyState >= 1) {
  setupScrub();
} else {
  video.addEventListener('loadedmetadata', setupScrub, { once: true });
}

// ロゴの中央配置は実際のwindow.innerWidth/innerHeightに依存するため、
// iOS Safariのアドレスバー開閉などでビューポートサイズが変わった際も再計算する
window.addEventListener('resize', () => {
  if (stageTrigger) runScrub(stageTrigger.progress);
});

/*
  iOS Safari対策(強化版): play()が返すPromiseが解決も拒否もされないまま固まる
  ケースがあるため、"success"の判定は'playing'イベント(実際に描画が始まった)
  だけで行う。成功するまでは、ページ側で最初にplay()を試すのに加えて、
  ユーザーの最初のスクロール/タップのたびに何度でも再試行し続ける
  (videoPrimedがtrueになった時点で全ての再試行をやめる)。
*/
let videoPrimed = false;

function tryPrimeVideo() {
  if (videoPrimed) return;
  const onPlaying = () => {
    videoPrimed = true;
    video.removeEventListener('playing', onPlaying);
    window.removeEventListener('touchstart', tryPrimeVideo);
    window.removeEventListener('scroll', tryPrimeVideo);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      video.pause();
      // 起爆のために再生した分だけcurrentTimeが進んでしまうため、
      // 現在のスクロール位置に基づいた正しいコマへ同期し直す
      // (ScrollTrigger.updateは実際のスクロール位置が変わっていないと
      // onUpdateを再発火しないため、progressを直接読んでrunScrubを呼ぶ)
      if (stageTrigger) runScrub(stageTrigger.progress);
    }));
  };
  video.addEventListener('playing', onPlaying);
  const playPromise = video.play();
  if (playPromise && typeof playPromise.catch === 'function') {
    playPromise.catch(() => {});
  }
}

if (video.readyState >= 2) {
  tryPrimeVideo();
} else {
  video.addEventListener('loadeddata', tryPrimeVideo, { once: true });
}
// play()が成功も失敗も返さず固まった場合の保険として、最初のスクロール/タップでも再試行する
window.addEventListener('touchstart', tryPrimeVideo, { passive: true });
window.addEventListener('scroll', tryPrimeVideo, { passive: true });

/*
  「24種類のラーメンがある」: 店内写真(幕1、〜0.32)の後、お湯が注がれる(幕3、0.60〜)の前、
  videoProgress 0.33〜0.59の区間に重ねるオーバーレイ。商品パッケージが左右バラバラの位置・
  角度から、それぞれ異なるタイミングで下から浮かび上がり、区間終盤でまとめて上へ抜けていく。
*/
const menuHeading = document.getElementById('menu-heading');

/*
  見出しの文字を1文字ずつ<span class="wave-char">に分解し、animation-delayを
  ずらして付与する。CSS側の@keyframes menuTitleWaveと組み合わせて、文字が
  順番に波打つように上下するエフェクトにする(em内の色指定はspanが継承するため、
  ここで分解しても「韓国ラーメン」のオレンジ色はそのまま保たれる)。
*/
function waveifyText(root) {
  let i = 0;
  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const frag = document.createDocumentFragment();
      for (const ch of node.textContent) {
        const span = document.createElement('span');
        span.className = 'wave-char';
        span.style.animationDelay = `${i * 0.045}s`;
        span.textContent = ch;
        frag.appendChild(span);
        i++;
      }
      node.replaceWith(frag);
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      Array.from(node.childNodes).forEach(walk);
    }
  }
  Array.from(root.childNodes).forEach(walk);
}
waveifyText(document.querySelector('.menu-title'));
waveifyText(document.querySelector('.menu-subtitle'));

const MENU_START = 0.33;
const MENU_END = 0.59;
const RISE_PX = 90;
const PACKET_DURATION = 0.42;
const EXIT_START = 0.82; // 区間内(0〜1)の後半でまとめて抜ける開始点

const packetConfigs = [
  { el: document.getElementById('packet-1'), rotate: -10, delay: 0.00 },
  { el: document.getElementById('packet-2'), rotate: 8,   delay: 0.07 },
  { el: document.getElementById('packet-3'), rotate: 12,  delay: 0.03 },
  { el: document.getElementById('packet-4'), rotate: -9,  delay: 0.10 },
  { el: document.getElementById('packet-5'), rotate: -15, delay: 0.14 },
  { el: document.getElementById('packet-6'), rotate: 14,  delay: 0.17 },
  { el: document.getElementById('packet-7'), rotate: 6,   delay: 0.21 },
  { el: document.getElementById('packet-8'), rotate: -7,  delay: 0.24 },
  { el: document.getElementById('packet-9'), rotate: 5,   delay: 0.28 },
];

/*
  浮遊感の立体感: 各パッケージにサイン波で上下・左右のゆらぎと3D傾き(rotationX/Y)を
  加える。時間経過のオート再生ではなく、区間内の進行度tに連動させる(スクロール量が
  そのまま揺れの位相になる)。パッケージごとに位相・周波数をずらして、一斉に揺れず
  バラバラに漂って見えるようにする。#overlayの`perspective`と組み合わせて、
  単なる2D回転ではない立体的な傾きに見せる。
*/
const FLOAT_FREQ = 2.2;
const FLOAT_AMP_Y = 14;
const FLOAT_AMP_X = 7;
const TILT_AMP = 8;

// 袋麺パッケージ: iPhoneでは小さく見えるとの指摘があったため、2倍に拡大(PC側は1倍のまま)
const PACKET_MOBILE_SCALE = IS_MOBILE ? 2 : 1;

packetConfigs.forEach((p, i) => {
  p.phase = i * 0.75;
  p.freq = FLOAT_FREQ * (1 + i * 0.06);
  gsap.set(p.el, {
    xPercent: 0,
    rotation: p.rotate,
    scaleX: (p.flip ? -1 : 1) * PACKET_MOBILE_SCALE,
    scaleY: PACKET_MOBILE_SCALE,
    transformPerspective: 800
  });
});

function updateMenuOverlay(videoProgress) {
  const span = MENU_END - MENU_START;
  let t;
  if (videoProgress <= MENU_START) {
    t = 0;
  } else if (videoProgress >= MENU_END) {
    t = 1;
  } else {
    t = (videoProgress - MENU_START) / span;
  }

  const exitT = Math.max(0, Math.min((t - EXIT_START) / (1 - EXIT_START), 1));

  // 見出し: 区間の頭ですっと浮かび上がり、終盤はパッケージと一緒に抜ける
  const headingEnterT = Math.min(t / 0.20, 1);
  const headingOpacity = headingEnterT * (1 - exitT);
  const headingY = (1 - headingEnterT) * 40 - exitT * 40;
  gsap.set(menuHeading, {
    xPercent: -50,
    yPercent: -50,
    opacity: headingOpacity,
    y: `${headingY}px`
  });

  packetConfigs.forEach(p => {
    const enterT = Math.max(0, Math.min((t - p.delay) / PACKET_DURATION, 1));
    const riseY = (1 - enterT) * RISE_PX - exitT * RISE_PX;
    const opacity = enterT * (1 - exitT);

    // 浮遊感: 定位置に着いてからも止まらず、サイン波で上下左右・3D傾きが漂い続ける
    const floatStrength = enterT * (1 - exitT);
    const wave = t * p.freq * Math.PI * 2 + p.phase;
    const bobY = Math.sin(wave) * FLOAT_AMP_Y * floatStrength;
    const bobX = Math.cos(wave * 0.6) * FLOAT_AMP_X * floatStrength;
    const tiltX = Math.sin(wave * 0.8 + 1) * TILT_AMP * floatStrength;
    const tiltY = Math.cos(wave * 0.7) * TILT_AMP * floatStrength;

    gsap.set(p.el, {
      y: `${riseY + bobY}px`,
      x: `${bobX}px`,
      opacity,
      rotationX: tiltX,
      rotationY: tiltY
    });
  });

  // 区間外(開始前・終了後)は完全に隠す
  if (videoProgress < MENU_START || videoProgress > MENU_END) {
    gsap.set(menuHeading, { opacity: 0 });
    packetConfigs.forEach(p => gsap.set(p.el, { opacity: 0 }));
  }
}

</script>
